spring.application.name=weather-svc
server.port=${PORT:8080}
# external weather api
weather.api.key=${WEATHER_API_KEY}
weather.api.url=https://api.openweathermap.org/data/2.5/weather
weather.api.units=metric

# CORS
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}

# cache
spring.cache.type=caffeine
spring.cache.cache-names=weather
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

# Resilience4j Retry
resilience4j.retry.instances.weatherRetry.max-attempts=3
resilience4j.retry.instances.weatherRetry.wait-duration=1s
resilience4j.retry.instances.weatherRetry.retry-exceptions=\com.nir.weather_svc.exception.WeatherServiceException

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.weatherCircuitBreaker.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.weatherCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.weatherCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.weatherCircuitBreaker.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.weatherCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.weatherCircuitBreaker.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.weatherCircuitBreaker.record-exceptions=com.nir.weather_svc.exception.WeatherServiceException

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n
